<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Until February</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Quicksand:wght@400;500;600;700&display=swap');

  :root{
    --cream: #FBF1E4;
    --paper: #FFFDF9;
    --ink: #392E43;
    --rose: #D98A94;
    --rose-deep: #C16B77;
    --air-red: #C1483F;
    --air-blue: #3E6E9E;
    --gold: #C9A15A;
    --line: rgba(57,46,67,0.15);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--cream);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(201,161,90,0.08), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(62,110,158,0.08), transparent 40%);
    font-family: 'Quicksand', sans-serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }

  .card{
    position:relative;
    width:100%;
    max-width: 620px;
    background: var(--paper);
    border-radius: 6px;
    box-shadow: 0 30px 60px -20px rgba(57,46,67,0.25);
    overflow:hidden;
  }

  .airmail-edge{
    height: 10px;
    width:100%;
    background: repeating-linear-gradient(
      -45deg,
      var(--air-red) 0px, var(--air-red) 14px,
      var(--paper) 14px, var(--paper) 22px,
      var(--air-blue) 22px, var(--air-blue) 36px,
      var(--paper) 36px, var(--paper) 44px
    );
  }

  .inner{
    padding: 40px 40px 36px;
  }

  @media (max-width: 480px){
    .inner{ padding: 28px 22px 26px; }
  }

  .top-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 20px;
    margin-bottom: 30px;
  }

  .polaroid{
    flex-shrink:0;
    width: 132px;
    background: white;
    padding: 8px 8px 20px;
    box-shadow: 0 10px 20px -8px rgba(57,46,67,0.35);
    transform: rotate(-4deg);
    border-radius: 2px;
  }

  .polaroid .frame{
    width:100%;
    aspect-ratio: 1/1;
    border-radius:1px;
    overflow:hidden;
    background: linear-gradient(135deg, #f3d9dc, #cfe0ec);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .polaroid img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .polaroid .fallback{
    font-size: 11px;
    text-align:center;
    color: var(--ink);
    opacity:0.55;
    padding: 10px;
    line-height:1.4;
  }

  .polaroid .caption{
    display:block;
    text-align:center;
    font-family:'Fraunces', serif;
    font-style: italic;
    font-size: 13px;
    margin-top: 8px;
    color: var(--ink);
    opacity:0.75;
  }

  .stamp{
    flex-shrink:0;
    width: 88px;
    height: 100px;
    border: 2.5px dashed var(--air-red);
    border-radius: 4px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transform: rotate(6deg);
    opacity:0.85;
    padding: 6px;
  }

  .stamp .num{
    font-family:'Fraunces', serif;
    font-size: 26px;
    line-height:1;
    color: var(--air-red);
    font-weight:600;
  }

  .stamp .lbl{
    font-size: 9px;
    letter-spacing: 0.06em;
    color: var(--air-red);
    margin-top: 4px;
    text-align:center;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style: italic;
    font-size: 21px;
    margin: 0 0 4px;
    color: var(--ink);
  }

  .subline{
    font-size: 14px;
    color: var(--ink);
    opacity:0.65;
    margin: 0 0 28px;
  }

  .countdown{
    text-align:center;
    margin: 6px 0 30px;
  }

  .countdown .big{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: clamp(64px, 18vw, 96px);
    line-height:0.95;
    color: var(--rose-deep);
  }

  .countdown .big-label{
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--ink);
    opacity:0.7;
    margin-top: 4px;
  }

  .stat-row{
    display:flex;
    justify-content:center;
    gap: 28px;
    margin-top: 18px;
  }

  .stat{
    text-align:center;
  }

  .stat .n{
    font-family:'Fraunces', serif;
    font-size: 22px;
    font-weight:600;
    color: var(--ink);
  }

  .stat .l{
    font-size: 11px;
    color: var(--ink);
    opacity:0.55;
    margin-top: 2px;
  }

  .route{
    margin: 34px 0 8px;
    position:relative;
  }

  .route-labels{
    display:flex;
    justify-content:space-between;
    font-size: 12px;
    color: var(--ink);
    opacity:0.6;
    margin-bottom: 10px;
  }

  .route-track{
    position:relative;
    height: 2px;
    background: repeating-linear-gradient(
      to right,
      var(--line) 0, var(--line) 6px,
      transparent 6px, transparent 12px
    );
    margin: 0 6px;
  }

  .route-track .pin{
    position:absolute;
    top:50%;
    transform: translate(-50%,-50%);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold);
  }
  .route-track .pin.start{ left:0; }
  .route-track .pin.end{ left:100%; }

  .route-track .plane{
    position:absolute;
    top:50%;
    transform: translate(-50%,-50%);
    font-size: 18px;
    transition: left 0.6s ease;
    filter: drop-shadow(0 2px 3px rgba(57,46,67,0.3));
  }

  .route-dates{
    display:flex;
    justify-content:space-between;
    font-size: 11px;
    color: var(--ink);
    opacity:0.45;
    margin-top: 8px;
  }

  .progress-pct{
    text-align:center;
    font-size: 12px;
    color: var(--ink);
    opacity:0.55;
    margin-top: 14px;
  }

  .note{
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    font-family:'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
    line-height:1.6;
    color: var(--ink);
    opacity:0.85;
    text-align:center;
  }

  .note .sign{
    display:block;
    margin-top: 10px;
    font-size: 13px;
    opacity:0.6;
  }

  @media (prefers-reduced-motion: reduce){
    .route-track .plane{ transition:none; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="airmail-edge"></div>
  <div class="inner">

    <div class="top-row">
      <div class="polaroid">
        <div class="frame">
          <img id="photo" src="us.jpg" alt="the two of you"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
          <div class="fallback" style="display:none; align-items:center; justify-content:center; height:100%;">
            add a photo named<br>"us.jpg" next to<br>this file
          </div>
        </div>
        <span class="caption">nós!</span>
      </div>

      <div class="stamp">
        <div class="num">22</div>
        <div class="lbl">Fevereiro</div>
      </div>
    </div>

    <h1>Oii meu amorr,</h1>
    <p class="subline">coloquei aqui o tempo até nosso próximo encontro.</p>

    <div class="countdown">
      <div class="big" id="daysLeft">--</div>
      <div class="big-label">days to go</div>
    </div>

    <div class="stat-row">
      <div class="stat"><div class="n" id="hoursLeft">--</div><div class="l">horas</div></div>
      <div class="stat"><div class="n" id="minsLeft">--</div><div class="l">minutos</div></div>
      <div class="stat"><div class="n" id="secsLeft">--</div><div class="l">segundos</div></div>
    </div>

    <div class="route">
      <div class="route-labels">
        <span>Você foi</span>
        <span>Eu vou!</span>
      </div>
      <div class="route-track">
        <div class="pin start"></div>
        <div class="plane" id="plane">✈️</div>
        <div class="pin end"></div>
      </div>
      <div class="route-dates">
        <span>16 de Ago</span>
        <span>22 de Fev</span>
      </div>
    </div>

    <div class="progress-pct" id="pct">-- % de progresso</div>

    <p class="note">
      todo dia chegando mais perto!
      <span class="sign">te amo muito</span>
    </p>

  </div>
</div>

<script>
  const start = new Date('2026-08-16T00:00:00');
  const end   = new Date('2027-02-22T00:00:00');

  function update(){
    const now = new Date();
    const totalMs = end - start;
    const elapsedMs = now - start;
    const remainingMs = Math.max(end - now, 0);

    const pct = Math.min(Math.max((elapsedMs / totalMs) * 100, 0), 100);

    const days = Math.floor(remainingMs / 86400000);
    const hours = Math.floor((remainingMs % 86400000) / 3600000);
    const mins = Math.floor((remainingMs % 3600000) / 60000);
    const secs = Math.floor((remainingMs % 60000) / 1000);

    document.getElementById('daysLeft').textContent = days;
    document.getElementById('hoursLeft').textContent = String(hours).padStart(2,'0');
    document.getElementById('minsLeft').textContent = String(mins).padStart(2,'0');
    document.getElementById('secsLeft').textContent = String(secs).padStart(2,'0');
    document.getElementById('plane').style.left = pct + '%';
    document.getElementById('pct').textContent = pct.toFixed(1) + '% of the way there';
  }

  update();
  setInterval(update, 1000);
</script>

</body>
</html>
